version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: gentong_mas_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d gentong_mas_erp']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '6000:6000'
    environment:
      NODE_ENV: production
      PORT: 6000
      DATABASE_URL: postgresql://erp:erp_password@postgres:5432/gentong_mas_erp
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:6000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:6000
      NEXT_PUBLIC_APP_NAME: Gentong Mas ERP — Admin
    depends_on:
      backend:
        condition: service_healthy

  sales-app:
    build:
      context: ./apps/sales-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://backend:6000
      NEXT_PUBLIC_APP_NAME: Gentong Mas — Sales App
    depends_on:
      backend:
        condition: service_healthy

  gudang-app:
    build:
      context: ./apps/gudang-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: http://backend:6000
      NEXT_PUBLIC_APP_NAME: Gentong Mas — Gudang App
    depends_on:
      backend:
        condition: service_healthy

  pos-app:
    build:
      context: ./apps/pos-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      NEXT_PUBLIC_API_URL: http://backend:6000
      NEXT_PUBLIC_APP_NAME: Gentong Mas — POS Kasir
    depends_on:
      backend:
        condition: service_healthy

  driver-app:
    build:
      context: ./apps/driver-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: 3005
      NEXT_PUBLIC_API_URL: http://backend:6000
      NEXT_PUBLIC_APP_NAME: Gentong Mas — Driver App
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
